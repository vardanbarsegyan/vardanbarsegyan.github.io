# Core site settings
locale: "en-US"
site_theme: "default"
title: "Dr. Vardan Barsegyan"
title_separator: "—"
name: &name "Dr. Vardan Barsegyan"
description: &description "Sociologist researching social inequality, migration, education, and political participation."
url: "https://www.vardanbarsegyan.com"
baseurl: ""
repository: "vardanbarsegyan/vardanbarsegyan.github.io"
asset_version: "20260904c"

# Author profile
author:
  avatar: "profile.jpg"
  name: "Dr. Vardan Barsegyan"
  bio: "Sociologist, PhD"
  location: "Amsterdam, the Netherlands"
  employer: "WODC Research and Data Centre"
  uri: "https://www.wodc.nl/personen/personen/vardan-barsegyan"
  email: "barsegyanw@gmail.com"
  googlescholar: "https://scholar.google.com/citations?user=yh5pBBoAAAAJ&hl=en"
  orcid: "https://orcid.org/0000-0002-4556-9415"
  github: "vardanbarsegyan"
  linkedin: "vardanbarsegyan"
  facebook: "vardan.m.barsegyan"
  twitter: "VardanBars"

# Presentation and navigation
teaser:
breadcrumbs: false
words_per_minute: 160
future: false
read_more: "disabled"
atom_feed:
  hide: true
  path:

# Search and social metadata
google_site_verification:
bing_site_verification:
twitter:
  username: "VardanBars"
facebook:
  username: "vardan.m.barsegyan"
  app_id:
  publisher:
og_image: "og.png"
og_image_alt: "Dr. Vardan Barsegyan — sociologist researching inequality, migration, and political participation."
og_description: *description
social:
  type: "Person"
  name: *name
  links:
    - "https://orcid.org/0000-0002-4556-9415"
    - "https://scholar.google.com/citations?user=yh5pBBoAAAAJ&hl=en"
    - "https://www.linkedin.com/in/vardanbarsegyan/"
    - "https://github.com/vardanbarsegyan"

analytics:
  provider: "google-analytics-4"
  google:
    tracking_id: "G-NT6VH36EG5"

# Jekyll input and output
include:
  - .htaccess
  - _pages
  - files
exclude:
  - "*.sublime-project"
  - "*.sublime-workspace"
  - .asset-cache
  - .bundle
  - .devcontainer
  - .github
  - .jekyll-assets-cache
  - .sass-cache
  - assets/js/_main.js
  - assets/js/plugins
  - CHANGELOG
  - Dockerfile
  - docker-compose.yaml
  - Gemfile
  - LICENSE
  - node_modules
  - package.json
  - package-lock.json
  - README.md
  - tmp
  - vendor
encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"

markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo

# The publications collection is retained only to preserve existing PDF/map URLs.
collections:
  publications:
    output: true
    permalink: /publications/:path/

defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true
  - scope:
      path: ""
      type: publications
    values:
      layout: single
      author_profile: true
      share: false
      comments: false

permalink: /:categories/:title/
timezone: Europe/Amsterdam

plugins:
  - jekyll-redirect-from
  - jekyll-sitemap

whitelist:
  - jekyll-redirect-from
  - jekyll-sitemap
