name: Build and deploy website

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Build and validate JavaScript
        run: |
          npm ci
          npm run build:js
          npm run test:js
          git diff --exit-code -- assets/js/main.min.js

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Build website
        env:
          JEKYLL_ENV: production
        run: bundle exec jekyll build --strict_front_matter --baseurl "${{ steps.pages.outputs.base_path }}"

      - name: Check generated links
        run: bundle exec htmlproofer ./_site --disable-external

      - name: Test browser interactions
        run: |
          python3 -m venv "$RUNNER_TEMP/browser-tests"
          "$RUNNER_TEMP/browser-tests/bin/pip" install -r tests/requirements.txt
          "$RUNNER_TEMP/browser-tests/bin/python" -m playwright install --with-deps chromium webkit
          "$RUNNER_TEMP/browser-tests/bin/python" tests/browser_smoke.py _site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
