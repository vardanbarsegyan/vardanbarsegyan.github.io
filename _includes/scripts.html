<script type="module" src="{{ base_path }}/assets/js/main.min.js?v={{ site.asset_version }}"></script>

<script>
/* Open only external web links in a new tab. */
document.querySelectorAll('a[href]').forEach(function (link) {
  const href = link.getAttribute('href').trim();
  if (!href || href.charAt(0) === '#') return;
  const url = new URL(href, document.baseURI);
  if (url.protocol !== 'http:' && url.protocol !== 'https:') return;
  const siteHost = new URL(document.baseURI).hostname.replace(/^www\./, '');
  const linkHost = url.hostname.replace(/^www\./, '');
  if (linkHost === siteHost || linkHost === 'vardanbarsegyan.github.io') {
    link.removeAttribute('target');
    return;
  }
  link.setAttribute('target', '_blank');
  link.relList.add('noopener', 'noreferrer');
});
</script>
